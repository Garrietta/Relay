org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# material3 1.5.0-beta01 and SegmentedShape were built against compileSdk 37;
# neither uses API-37-only features (verified: pure Compose). Suppress the
# AAR metadata check rather than cascading an AGP bump for a debug build.
android.suppressUnsupportedCompileSdk=37
